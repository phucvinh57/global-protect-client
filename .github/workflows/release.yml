name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built version as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      # Tauri 2.6's sidecar copier assumes the Cargo layout used before 1.100.
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev pkg-config \
            libopenconnect-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf vpnc-scripts
          rustup toolchain install 1.99.0 --profile minimal --component clippy

      - name: Check release version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          assert json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          for path in [pathlib.Path('src-tauri/Cargo.toml'), *pathlib.Path('src-tauri/crates').glob('*/Cargo.toml')]:
              assert tomllib.loads(path.read_text())['package']['version'] == version, path
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: |
          bun run lint:react
          bun run build

      - name: Stage development helper
        run: bun run scripts/build-helper.ts

      - name: Test Rust workspace
        run: |
          # The existing TLS hashing test expects this ignored certificate.
          # Generate it only in CI; no certificates or keys enter the release.
          mkdir -p src-tauri/crates/gp-auth/tests/fixtures
          trap 'rm -f src-tauri/crates/gp-auth/tests/fixtures/self-signed.pem "$RUNNER_TEMP/gp-client-test.key"' EXIT
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj /CN=gp-client-test.invalid \
            -keyout "$RUNNER_TEMP/gp-client-test.key" \
            -out src-tauri/crates/gp-auth/tests/fixtures/self-signed.pem
          cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml \
            -p gp-cli -p gp-store -p gp-helper --all-targets -- -D warnings

      - name: Build desktop package
        run: bun run tauri build --bundles deb

      - name: Build standalone CLI
        run: ./scripts/build-cli.sh --locked --release

      - name: Assemble release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          directory="gp-client-cli_${VERSION}_linux-x86_64"
          mkdir -p "$RUNNER_TEMP/$directory"
          install -m755 src-tauri/target/cli/release/gp-client "$RUNNER_TEMP/$directory/gp-client"
          install -m755 src-tauri/target/cli/release/gp-helper "$RUNNER_TEMP/$directory/gp-helper"
          install -m644 README.md "$RUNNER_TEMP/$directory/README.md"
          tar -C "$RUNNER_TEMP" -czf "release-assets/$directory.tar.gz" "$directory"
          dpkg-deb --info release-assets/*.deb
          tar -tzf "release-assets/$directory.tar.gz"
          (cd release-assets && sha256sum *.deb *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gp-client-linux-${{ steps.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release-assets/* \
            --title "gp-client v$VERSION" --target "$GITHUB_SHA" --generate-notes
