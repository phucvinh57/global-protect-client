<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="gp-client">
	<title>gp-client</title>
	<desc>A guard's plate, folded down its centre ridge, with a watch slit cut into the fold. The slit stops short of both ends: the plate holds.</desc>
	<defs>
		<linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6941C6"/>
			<stop offset="0.55" stop-color="#42307D"/>
			<stop offset="1" stop-color="#2C1C5F"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#B692F6" stop-opacity="0.34"/>
			<stop offset="0.6" stop-color="#B692F6" stop-opacity="0.1"/>
			<stop offset="1" stop-color="#B692F6" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="tile">
			<rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
		</clipPath>
		<!-- The plate, less the watch slit cut into its fold. -->
		<mask id="plate">
			<path d="M 128 152 L 172 100 L 340 100 L 384 152 L 384 292 C 384 356 330 396 256 420 C 182 396 128 356 128 292 Z" fill="#FFFFFF"/>
			<rect x="243" y="164" width="26" height="130" rx="6" ry="6" fill="#000000"/>
		</mask>
	</defs>

	<g clip-path="url(#tile)">
		<rect x="0" y="0" width="512" height="512" fill="url(#ground)"/>

		<!-- Lit from behind the plate, centred on the slit. -->
		<rect x="-4" y="-26" width="520" height="520" fill="url(#glow)"/>

		<!-- Two facets of one fold: light rakes across the left, falls off the right. -->
		<g mask="url(#plate)">
			<rect x="120" y="92" width="136" height="336" fill="#F4EBFF"/>
			<rect x="256" y="92" width="136" height="336" fill="#D6BBFB"/>
		</g>
	</g>

	<rect x="1.5" y="1.5" width="509" height="509" rx="110.5" ry="110.5"
		fill="none" stroke="#B692F6" stroke-opacity="0.22" stroke-width="3"/>
</svg>
