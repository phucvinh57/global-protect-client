<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="gp-client">
	<title>gp-client</title>
	<desc>A route that leaves the open network, runs beneath it, and rejoins it further along.</desc>
	<defs>
		<linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6941C6"/>
			<stop offset="0.55" stop-color="#42307D"/>
			<stop offset="1" stop-color="#2C1C5F"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#B692F6" stop-opacity="0.32"/>
			<stop offset="0.6" stop-color="#B692F6" stop-opacity="0.09"/>
			<stop offset="1" stop-color="#B692F6" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="plate">
			<rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
		</clipPath>
	</defs>

	<g clip-path="url(#plate)">
		<rect x="0" y="0" width="512" height="512" fill="url(#ground)"/>

		<!-- Lit from inside the run: glow centred on its lowest point. -->
		<rect x="16" y="148" width="480" height="480" fill="url(#glow)"/>

		<!-- The open network. It runs past both edges, and breaks where the
		     tunnel crosses it: passing through, not joining. -->
		<g stroke="#B692F6" stroke-opacity="0.75" stroke-width="24" stroke-linecap="butt">
			<line x1="0" y1="228" x2="104" y2="228"/>
			<line x1="188" y1="228" x2="324" y2="228"/>
			<line x1="408" y1="228" x2="512" y2="228"/>
		</g>

		<!-- The tunnel: down off the open network, along beneath it, back up. -->
		<path d="M -20 124 H 104 Q 146 124 146 166 V 338 Q 146 388 196 388 H 316 Q 366 388 366 338 V 166 Q 366 124 408 124 H 532"
			fill="none" stroke="#F4EBFF" stroke-width="48" stroke-linecap="butt" stroke-linejoin="round"/>
	</g>

	<rect x="1.5" y="1.5" width="509" height="509" rx="110.5" ry="110.5"
		fill="none" stroke="#B692F6" stroke-opacity="0.22" stroke-width="3"/>
</svg>
