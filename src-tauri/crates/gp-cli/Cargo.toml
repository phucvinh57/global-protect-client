[package]
name = "gp-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "gp-client"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gp-store = { path = "../gp-store" }
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "process", "sync", "signal", "time"] }
