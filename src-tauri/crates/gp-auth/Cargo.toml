[package]
name = "gp-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
	"blocking",
	"form",
	"query",
	"rustls-no-provider",
] }
roxmltree = "0.21"
# `ring` rather than the default `aws-lc-rs`: it needs no cmake/NASM toolchain.
rustls = { version = "0.23", default-features = false, features = [
	"ring",
	"std",
	"tls12",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sha2 = "0.10"
thiserror = "2"
urlencoding = "2"
x509-parser = "0.17"
zeroize = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
